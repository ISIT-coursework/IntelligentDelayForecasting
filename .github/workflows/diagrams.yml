name: Structurizr diagrams

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diagrams-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagrams:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DIAGRAM_PULL_POLICY: missing

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test architecture rules
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Validate model and export HTML documentation
        run: make diagrams-render

      - name: Upload architecture documentation
        uses: actions/upload-artifact@v4
        with:
          name: architecture-${{ github.sha }}
          path: build/diagrams/
          if-no-files-found: error
          retention-days: 30
